<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500">
    <title>GuitarShelf guitar</title>
    <desc>A classical guitar with a dark outline and a light outer edge, on a transparent background.</desc>
    <!-- Original local vector artwork, following Project 2's guitar motif. -->
    <defs>
        <g id="guitar-shape">
            <path d="M-24-100 C-80-115-123-78-106-31 C-95-2-79 14-91 41 C-150 105-112 165 0 165 C112 165 150 105 91 41 C79 14 95-2 106-31 C123-78 80-115 24-100 Z" />
            <rect x="-17" y="-238" width="34" height="158" rx="3" />
            <rect x="-26" y="-299" width="52" height="68" rx="9" />
            <path d="M-36-283 H-26 M26-283 H36 M-36-264 H-26 M26-264 H36 M-36-245 H-26 M26-245 H36" />
        </g>
    </defs>
    <g transform="translate(285 305) rotate(35)" stroke-linecap="round" stroke-linejoin="round">
        <!-- A light halo keeps the silhouette visible on dark backgrounds. -->
        <use href="#guitar-shape" fill="#f6f5f1" stroke="#f6f5f1" stroke-width="14" />
        <use href="#guitar-shape" fill="#f6f5f1" stroke="#252525" stroke-width="5" />
        <rect x="-12" y="-226" width="24" height="143" rx="1" fill="#252525" />
        <path d="M-12-204 H12 M-12-185 H12 M-12-167 H12 M-12-151 H12 M-12-136 H12 M-12-122 H12 M-12-109 H12 M-12-97 H12" fill="none" stroke="#deddd8" stroke-width="1.3" />
        <circle cy="-19" r="34" fill="none" stroke="#252525" stroke-width="3" />
        <circle cy="-19" r="27" fill="#252525" />
        <rect x="-39" y="96" width="78" height="16" rx="4" fill="#252525" />
        <path d="M-27 103 H27" stroke="#f6f5f1" stroke-width="3" />
        <path d="M-9-271 V103 M-5-271 V103 M-1-271 V103 M3-271 V103 M7-271 V103 M11-271 V103" fill="none" stroke="#99948b" stroke-width="1" />
        <g fill="#252525">
            <circle cx="-12" cy="-283" r="3" /><circle cx="12" cy="-283" r="3" />
            <circle cx="-12" cy="-264" r="3" /><circle cx="12" cy="-264" r="3" />
            <circle cx="-12" cy="-245" r="3" /><circle cx="12" cy="-245" r="3" />
