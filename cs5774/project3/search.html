<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Search results | GuitarShelf</title>
        <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="styles.css" />
        <!-- Local jQuery is the only application library; defer preserves script order. -->
        <script src="js/vendor/jquery-3.7.1.min.js" defer></script>
        <script src="js/app.js" defer></script>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to content</a>
        <header>
            <div class="site-header">
                <div class="topbar">
                    <a class="brand" href="index.html">GuitarShelf</a>
                    <!-- GET sends a shareable keyphrase to the separate results page. -->
                    <form class="site-search" action="search.html" method="get" role="search">
                        <label for="site-q">Search sheet music</label>
                        <input
                            id="site-q"
                            name="q"
                            type="search"
                            placeholder="Try fingerstyle"
                            maxlength="120"
                        />
                        <button type="submit">Search</button>
                    </form>
                    <a href="library.html">Demo library</a>
                </div>
                <nav class="primary" aria-label="Primary navigation">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="browse.html">Browse sheet music</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <main id="main">
            <noscript
                ><p class="status">
                    Enable JavaScript to search, save pieces, and change practice status.
                </p></noscript
            >

            <h1>Search results</h1>
            <p id="search-summary" role="status">Preparing results…</p>
            <section aria-labelledby="results-title">
                <h2 id="results-title">Matching sheet music</h2>
                <div class="card-grid" id="search-results"></div>
            </section>
            <template id="piece-template">
                <article class="sheet-card card">
                    <img alt="" />
                    <h3 class="piece-title"></h3>
                    <p class="meta"></p>
                    <p class="piece-description"></p>
                    <div class="actions">
                        <a class="open-link">Open sheet music</a
                        ><button class="save-button secondary" type="button" aria-pressed="false">
                            Save to library
                        </button>
                    </div>
                    <div class="practice-controls">
                        <label>Practice status</label
                        ><select class="practice-select">
                            <option value="planned">To practice</option>
                            <option value="practicing">Practicing</option>
                            <option value="learned">Learned</option>
                        </select>
                        <p class="practice-badge">To practice</p>
                    </div>
                    <div class="card-notices" aria-live="polite"></div>
                </article>
            </template>
        </main>
        <footer>
            <div class="footer-inner">
                <p>© 2026 GuitarShelf · Course prototype</p>
                <p>Jianpeng Chen · CS 5774 Project 3</p>
            </div>
        </footer>
    </body>
</html>
