<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Search results | GuitarShelf</title>
        <meta
            name="description"
            content="Real classical guitar scores, listening examples, and a simple practice library."
        />
        <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml" />
        <link rel="stylesheet" href="styles.css" />
        <!-- jQuery is the only runtime library. External defer scripts run in order. -->
        <script src="js/vendor/jquery-3.7.1.min.js" defer></script>
        <script src="js/app.js" defer></script>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to content</a>
        <header class="site-header">
            <div class="container">
                <div class="header-top">
                    <a class="brand" href="index.html">
                        GuitarShelf
                        <span class="brand-dot">.</span>
                    </a>
                    <!-- GET submits q to the separate simulated results page. -->
                    <form
                        class="header-search site-search"
                        action="search.html"
                        method="get"
                        role="search"
                    >
                        <label class="visually-hidden" for="site-q">Search sheet music</label>
                        <input
                            id="site-q"
                            type="search"
                            name="q"
                            maxlength="120"
                            placeholder="Try fingerstyle"
                        />
                        <button class="button" type="submit">Search</button>
                    </form>
                    <div class="account-controls">
                        <a class="text-link" id="login-link" href="login.html">Log in</a>
                        <span class="account-label" id="signed-in-label" hidden>jianpengc</span>
                        <button class="button secondary" id="logout-button" type="button" hidden>
                            Log out
                        </button>
                    </div>
                </div>
                <nav class="primary-nav" aria-label="Primary navigation">
                    <a href="index.html">Home</a>
                    <a href="browse.html">Browse sheet music</a>
                    <a href="library.html" class="workspace-link" hidden>My library</a>
                    <a href="add.html" class="workspace-link" hidden>Add sheet music</a>
                </nav>
            </div>
        </header>
        <main class="container" id="main">
            <noscript>
                <p class="notice">
                    Enable JavaScript to log in, search, save pieces, and track practice. The browse
                    page still links to each score.
                </p>
            </noscript>
            <div class="page-heading">
                <p class="eyebrow">Simulated search</p>
                <h1>Search results</h1>
                <p id="search-summary" role="status">Preparing results…</p>
            </div>
            <section aria-labelledby="results-title">
                <div class="section-heading">
                    <h2 id="results-title">Matching sheet music</h2>
                    <a class="text-link" href="browse.html">Browse all pieces →</a>
                </div>
                <div class="sheet-grid home-grid" id="search-results"></div>
            </section>
            <template id="piece-template">
                <article class="sheet-card">
                    <!-- PDF-rendered preview sources (full licenses also in assets/credits.txt):
         Carcassi: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=13, Jeff Covey, public domain.
         Sor Andante: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=413, Mark Van den Borre, CC BY-SA 4.0.
         Sor Thema: https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=455, Mark Van den Borre, CC BY-SA 3.0. -->
                    <img src="assets/previews/carcassi.png" alt="Score preview" />
                    <div class="card-copy">
                        <p class="eyebrow piece-focus"></p>
                        <h3 class="piece-title"></h3>
                        <p class="byline meta"></p>
                        <p class="piece-description"></p>
                        <div class="card-actions">
                            <a class="open-link text-link">Open sheet music</a>
                            <button
                                class="button secondary save-button"
                                type="button"
                                aria-pressed="false"
                            >
                                Save to library
                            </button>
                        </div>
                        <div class="practice-controls">
                            <label>Practice status</label>
                            <select class="practice-select">
                                <option value="planned">To practice</option>
                                <option value="practicing">Practicing</option>
                                <option value="learned">Learned</option>
                            </select>
                            <p class="practice-badge">To practice</p>
                        </div>
                        <div class="card-notices" aria-live="polite"></div>
                    </div>
                </article>
            </template>
        </main>
        <footer class="site-footer">
            <div class="container footer-inner">
                <p>GuitarShelf · CS 5774 Project 3 · Jianpeng Chen</p>
                <p>
                    Curated by jianpengc ·
                    <a href="assets/credits.txt">Music &amp; asset credits</a>
                </p>
            </div>
        </footer>
    </body>
</html>
